<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board with Random Dot</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .ludo-board {
            width: 500px;
            height: 500px;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            border: 2px solid #333;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .cell {
            border: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Center square */
        .center {
            background-color: #f9f9f9;
            grid-column: 6 / span 4;
            grid-row: 6 / span 4;
        }

        /* Home paths */
        .home-path {
            background-color: #f0f0f0;
        }

        /* Player paths */
        .red-path {
            background-color: #ffcccc;
        }
        .blue-path {
            background-color: #ccccff;
        }
        .green-path {
            background-color: #ccffcc;
        }
        .yellow-path {
            background-color: #ffffcc;
        }

        /* Start positions */
        .red-start {
            background-color: #ff6666;
        }
        .blue-start {
            background-color: #6666ff;
        }
        .green-start {
            background-color: #66ff66;
        }
        .yellow-start {
            background-color: #ffff66;
        }

        /* Fixed positions (10-13) */
        .fixed-position {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #000;
            border-radius: 50%;
            z-index: 10;
        }

        .fixed-position.red {
            background-color: #ff0000;
        }

        /* Instructions */
        .instructions {
            position: absolute;
            bottom: 20px;
            text-align: center;
            width: 100%;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="ludo-board" id="ludoBoard">
        <!-- Board will be generated by JavaScript -->
    </div>

    <div class="instructions">
        <p>Scroll to randomize the red dot on positions 10-13</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const board = document.getElementById('ludoBoard');
            const size = 15;
            const cellSize = 500 / size;

            // Create board cells
            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.style.width = `${cellSize}px`;
                cell.style.height = `${cellSize}px`;

                // Add center square
                if (i >= 6*15 + 6 && i < 6*15 + 10 && i % 15 >= 6 && i % 15 < 10) {
                    cell.classList.add('center');
                }

                // Add home paths
                if (i >= 0 && i < 5) cell.classList.add('red-path');
                if (i >= 10 && i < 15) cell.classList.add('blue-path');
                if (i >= 15*5 && i < 15*5 + 5) cell.classList.add('green-path');
                if (i >= 15*10 && i < 15*10 + 5) cell.classList.add('yellow-path');

                // Add start positions
                if (i === 5) cell.classList.add('red-start');
                if (i === 15*10 + 10) cell.classList.add('blue-start');
                if (i === 15*14 + 5) cell.classList.add('green-start');
                if (i === 15*5 + 10) cell.classList.add('yellow-start');

                board.appendChild(cell);
            }

            // Create fixed positions (10-13)
            const fixedPositions = [10, 11, 12, 13];
            const fixedDots = [];

            fixedPositions.forEach(pos => {
                const cell = board.children[pos];
                const dot = document.createElement('div');
                dot.className = 'fixed-position red';
                cell.appendChild(dot);
                fixedDots.push(dot);
            });

            // Scroll event to randomize dot position
            board.addEventListener('wheel', function(e) {
                e.preventDefault();
                const randomIndex = Math.floor(Math.random() * fixedPositions.length);
                const randomDot = fixedDots[randomIndex];

                // Remove all dots first
                fixedDots.forEach(dot => {
                    dot.remove();
                });

                // Add the random dot back
                const cell = board.children[fixedPositions[randomIndex]];
                cell.appendChild(randomDot);
            });
        });
    </script>
</body>
</html>
